<style>

<body>
<iframe id="site" src="/ghar_ka_zayeka_website_cart_updated.html?v=20261128c" title="Ghar Ka Zayeka"></iframe>
<script>
(function(){
const frame=document.getElementById('site');
const icon='<svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;vertical-align:-3px;stroke:#000;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>';
function apply(){try{const d=frame.contentDocument;if(!d)return;if(!d.getElementById('cart-white-black-overrides')){const style=d.createElement('style');style.id='cart-white-black-overrides';style.textContent=`.cart-panel{background:#fff!important}#cartOpen{background:#fff!important;color:#111!important;border:1px solid #d8d8d8!important}#cartOpen .cart-icon,.dish-actions .cart-icon{stroke:#000!important}a[href*="swiggy.com"],a[href*="zomato"],a[href*="wa.me"],a[href*="whatsapp"],a[href*="api.whatsapp"]{background:#fff!important;background-color:#fff!important}.order-buttons a,.social-buttons a,.delivery-buttons a,.review-buttons a{background-color:#fff!important}.payment-checkout a#cartCheckout,.payment-checkout a#cartCheckout:link,.payment-checkout a#cartCheckout:visited,a#cartCheckout{background:#84301a!important;background-color:#84301a!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border:1px solid #84301a!important;opacity:1!important}.payment-checkout a#cartCheckout:hover,.payment-checkout a#cartCheckout:focus,a#cartCheckout:hover,a#cartCheckout:focus{background:#43180f!important;background-color:#43180f!important;color:#fff!important;-webkit-text-fill-color:#fff!important}`;d.head.appendChild(style)}const nav=d.getElementById('cartOpen');if(nav&&!nav.querySelector('svg.cart-icon')){const count=nav.querySelector('#cartCount');nav.innerHTML=icon+' Cart <span id="cartCount">'+(count?count.textContent:'0')+'</span>'}d.querySelectorAll('.dish-actions button.btn.gold').forEach(b=>{if(b.textContent.includes('🛒'))b.innerHTML=icon+' Add to Cart'});frame.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){}}
frame.addEventListener('load',function(){apply();const d=frame.contentDocument;if(d){new MutationObserver(apply).observe(d.body,{childList:true,subtree:true,characterData:true});new ResizeObserver(apply).observe(d.documentElement)}});
})();
</script>
</body>
